# LLM Relay providers (TEMPLATE — committed defaults)
#
# This file is a generic example. To override with your own setup, point
# llm-relay at a private config dir:
#
#     export LLM_RELAY_CONFIG_DIR=/path/to/your/private/llm-relay/config
#
# Each provider is a host. Per-model ports/paths live in models.yaml.
#
# `ownership` is REQUIRED on every provider — the loader refuses to start
# without it. It declares who owns the physical hardware:
#
#   ciq_owned    — you control the machine end to end. Any workload may run
#                  there, confidential or not.
#   third_party  — borrowed, shared, or vendor-hosted metal. Serves ONLY
#                  requests that explicitly declare
#                  `X-Llm-Relay-Confidentiality: non_confidential`.
#
# There is deliberately no default: an untagged provider would inherit a guess,
# and guessing "we own this" about borrowed hardware silently routes
# confidential work onto it.

providers:
  local-llm:
    type: openai
    base_url: http://127.0.0.1
    ownership: ciq_owned
    enabled: true
    health_endpoint: /v1/models
    poll_interval: 15s
    health_check_timeout: 5s
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout: 30s

  # Vendor-neutral example of a CLOUD tier, kept disabled. Deliberately generic:
  # this template ships no real vendor, and `type:` has only one value (`openai`)
  # because the relay speaks OpenAI-compatible chat-completions to everything.
  # Present so the privacy axis (`X-Llm-Relay-Privacy: cloud_ok` + the `cloud` key
  # scope) has something to gate — see tests/test_selector.py.
  #
  # Reaching a provider like this needs BOTH `privacy: cloud_ok` AND a
  # `non_confidential` declaration: it is someone else's hardware on both axes.
  example-cloud:
    type: openai
    base_url: https://cloud.example.invalid
    ownership: third_party
    enabled: false
    auth_source: vault
